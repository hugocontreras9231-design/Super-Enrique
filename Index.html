data:text/html,<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Super Enrique</title><style>body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;}canvas{background:#2b2b2b;border:3px solid #fff;image-rendering:pixelated;}</style></head><body><canvas id="game" width="320" height="180"></canvas><script>const canvas=document.getElementById("game");const ctx=canvas.getContext("2d");let keys={};let gravity=0.5;let player={x:20,y:130,vx:0,vy:0,w:12,h:16,onGround:false};let bug={x:200,y:136,w:12,h:12,vx:-0.5};const groundY=150;window.addEventListener("keydown",e=>keys[e.code]=true);window.addEventListener("keyup",e=>keys[e.code]=false);function update(){player.vx=0;if(keys["ArrowRight"])player.vx=1.2;if(keys["ArrowLeft"])player.vx=-1.2;if(keys["Space"]&&player.onGround){player.vy=-8;player.onGround=false;}player.vy+=gravity;player.x+=player.vx;player.y+=player.vy;if(player.y+player.h>=groundY){player.y=groundY-player.h;player.vy=0;player.onGround=true;}bug.x+=bug.vx;if(bug.x<160||bug.x>260)bug.vx*=-1;if(player.x<bug.x+bug.w&&player.x+player.w>bug.x&&player.y<bug.y+bug.h&&player.y+player.h>bug.y){if(player.vy>0){bug.x=-999;player.vy=-6;}}}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#1a1a1a";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#3e3e3e";ctx.fillRect(0,groundY,canvas.width,30);ctx.fillStyle="#4ee3ff";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle="#ff4e4e";ctx.fillRect(bug.x,bug.y,bug.w,bug.h);}function loop(){update();draw();requestAnimationFrame(loop);}loop();</script></body></html>
