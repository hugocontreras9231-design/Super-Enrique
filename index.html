<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Enrique – Chip Forest</title>
<style>
    body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    canvas {
        background: #2b2b2b;
        border: 3px solid #fff;
        image-rendering: pixelated;
    }

    .controls {
        margin-top: 10px;
        display: flex;
        gap: 20px;
    }

    .btn {
        width: 70px;
        height: 70px;
        background: #333;
        border: 2px solid #fff;
        border-radius: 10px;
        color: white;
        font-size: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: none;
    }
</style>
</head>

<body>

<canvas id="game" width="320" height="180"></canvas>

<div class="controls">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="jump">⤒</div>
    <div class="btn" id="right">▶</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
let gravity = 0.45;

// --- PLAYER ---
let player = {
    x: 20,
    y: 130,
    vx: 0,
    vy: 0,
    w: 14,
    h: 18,
    onGround: false
};

// --- ENEMY ---
let bug = {
    x: 200,
    y: 136,
    w: 14,
    h: 14,
    vx: -0.6
};

// GROUND
const groundY = 150;

// DESKTOP CONTROLS
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// TOUCH CONTROLS
function bindButton(id, keyCode) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", () => keys[keyCode] = true);
    btn.addEventListener("touchend", () => keys[keyCode] = false);
}

bindButton("left", "ArrowLeft");
bindButton("right", "ArrowRight");
bindButton("jump", "Space");

function update() {
    // Horizontal movement
    player.vx = 0;
    if (keys["ArrowRight"]) player.vx = 1.3;
    if (keys["ArrowLeft"])  player.vx = -1.3;

    // Jump
    if (keys["Space"] && player.onGround) {
        player.vy = -7.8;
        player.onGround = false;
    }

    // Physics
    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Ground collision
    if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
    }

    // Enemy movement
    bug.x += bug.vx;
    if (bug.x < 150 || bug.x > 260) bug.vx *= -1;

    // Player vs Enemy
    if (player.x < bug.x + bug.w &&
        player.x + player.w > bug.x &&
        player.y < bug.y + bug.h &&
        player.y + player.h > bug.y) {

        if (player.vy > 0) {
            bug.x = -999;   // kill bug
            player.vy = -6; // bounce
        }
    }
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Background
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Ground
    ctx.fillStyle = "#3e3e3e";
    ctx.fillRect(0, groundY, canvas.width, 40);

    // Player (Enrique)
    ctx.fillStyle = "#4ee3ff";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Enemy
    ctx.fillStyle = "#ff4e4e";
    ctx.fillRect(bug.x, bug.y, bug.w, bug.h);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
