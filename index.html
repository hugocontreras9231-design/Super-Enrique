<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Enrique – Chip Forest</title>
<style>
    body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    canvas {
        background: #2b2b2b;
        border: 3px solid #fff;
        image-rendering: pixelated;
    }

    .controls {
        margin-top: 10px;
        display: flex;
        gap: 20px;
    }

    .btn {
        width: 70px;
        height: 70px;
        background: #333;
        border: 2px solid #fff;
        border-radius: 10px;
        color: white;
        font-size: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: none;
    }
</style>
</head>

<body>

<canvas id="game" width="320" height="180"></canvas>

<div class="controls">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="jump">⤒</div>
    <div class="btn" id="right">▶</div>
</div>

<script>
const canvas = document.getElementById("game");

};

window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function bindButton(id, keyCode) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", () => keys[keyCode] = true);
    btn.addEventListener("touchend", () => keys[keyCode] = false);
}

bindButton("right", "ArrowRight");
bindButton("jump", "Space");
