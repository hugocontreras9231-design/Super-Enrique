<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Super Enrique</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            background: #222;
            border: 3px solid #fff;
            image-rendering: pixelated;
        }

        /* Controles móviles */
        .controls {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            width: 60px;
            height: 60px;
            font-size: 28px;
            border-radius: 15px;
            border: none;
            background: #444;
            color: white;
        }

        button:active {
            background: #777;
        }
    </style>
</head>

<body>

    <canvas id="game"></canvas>

    <div class="controls">
        <button id="left">◀</button>
        <button id="jump">⤒</button>
        <button id="right">▶</button>
    </div>

    <!-- Aquí se carga tu juego -->
    <script src="script.js"></script>

</body>
</html>
